plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.nuerosiren'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.example.nuerosiren"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
    implementation 'org.tensorflow:tensorflow-lite:2.16.1' // or higher
    //implementation 'org.tensorflow:tensorflow-lite-support:0.4.4' // or higher
    def camerax_version = "1.3.1"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    // ✨ Google ML Kit for Facial Landmark Tracking
    implementation 'com.google.mlkit:face-detection:16.1.6'
    
    // 🤸 Google ML Kit Pose Detection
    implementation 'com.google.mlkit:pose-detection:18.0.0-beta5'
}

